<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text & Image to Emoji Art Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Text & Image to Emoji Art Generator</h1>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="text">Text to Emoji</button>
      <button class="tab-btn" data-tab="image">Image to Emoji</button>
    </div>

    <div class="tab-content active" id="text-tab">
      <div class="controls">
        <div class="input-group">
          <label for="text">Enter Text:</label>
          <input type="text" id="text" value="HI">
        </div>
        <div class="input-group">
          <label for="foreground">Foreground Emoji:</label>
          <input type="text" id="foreground" value="☀️">
        </div>
        <div class="input-group">
          <label for="background">Background Emoji:</label>
          <input type="text" id="background" value="🌊">
        </div>
        <button id="generate">Generate</button>
      </div>
    </div>

    <div class="tab-content" id="image-tab">
      <div class="controls">
        <div class="input-group">
          <label for="image-upload">Upload Image:</label>
          <input type="file" id="image-upload" accept="image/*">
        </div>
        <div class="input-group">
          <label for="max-width">Max Width (pixels):</label>
          <input type="number" id="max-width" value="32" min="1" max="100">
        </div>
        <div class="input-group">
          <label for="max-height">Max Height (pixels):</label>
          <input type="number" id="max-height" value="32" min="1" max="100">
        </div>
        <button id="convert-image">Convert</button>
      </div>
      <div class="preview-container">
        <canvas id="preview" style="display: none;"></canvas>
      </div>
    </div>

    <div class="output-container">
      <pre id="output"></pre>
      <button id="copy" class="copy-btn">Copy to Clipboard</button>
    </div>
  </div>
  <script src="script.js" type="module"></script>

</body>
</html>
