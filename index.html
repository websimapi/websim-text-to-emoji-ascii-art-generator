<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Emoji ASCII Art Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Text to Emoji ASCII Art Generator</h1>
    <div class="controls">
      <div class="input-group">
        <label for="text">Enter Text:</label>
        <input type="text" id="text" value="HI">
      </div>
      <div class="input-group">
        <label for="foreground">Foreground Emoji:</label>
        <input type="text" id="foreground" value="☀️">
      </div>
      <div class="input-group">
        <label for="background">Background Emoji:</label>
        <input type="text" id="background" value="🌊">
      </div>
      <button id="generate">Generate</button>
    </div>
    <div class="output-container">
      <pre id="output"></pre>
      <button id="copy" class="copy-btn">Copy to Clipboard</button>
    </div>
  </div>
  <script src="script.js" type="module"></script>
